<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8844EE"/>
      <stop offset="1" stop-color="#B07DFB"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect x="0" y="0" width="1000" height="580" rx="24" fill="#FAFBFC"/>

  <!-- Cabeçalho -->
  <rect x="0" y="0" width="1000" height="96" rx="24" fill="url(#grad)"/>
  <rect x="0" y="60" width="1000" height="36" fill="url(#grad)"/>
  <text x="40" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#FFFFFF">Estrutura do projeto Wildbeast</text>

  <!-- Painel da árvore -->
  <rect x="30" y="126" width="940" height="424" rx="16" fill="#FFFFFF" stroke="#B07DFB" stroke-width="2"/>

  <g font-family="Courier New, Courier, monospace" font-size="18" xml:space="preserve">
    <text x="60" y="170" fill="#8844EE" font-weight="700">wildbeast/</text>

    <text x="60" y="204" fill="#2C2C2C">├── index.html</text>
    <text x="60" y="238" fill="#2C2C2C">├── LICENSE</text>
    <text x="60" y="272" fill="#2C2C2C">├── README.md</text>
    <text x="60" y="306" fill="#2C2C2C">└── src/</text>

    <text x="60" y="340" fill="#2C2C2C">    ├── assets/</text>
    <text x="60" y="374" fill="#2C2C2C">    │   ├── icones/</text>
    <text x="60" y="408" fill="#2C2C2C">    │   └── images/</text>

    <text x="60" y="442" fill="#2C2C2C">    └── components/</text>
    <text x="60" y="476" fill="#2C2C2C">        └── css/</text>
    <text x="60" y="510" fill="#2C2C2C">            └── style.css</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#555555" font-style="italic">
    <text x="440" y="204">página principal do site</text>
    <text x="440" y="238">licença MIT</text>
    <text x="440" y="272">documentação do projeto</text>

    <text x="440" y="374">7 arquivos .svg (logo e ícones dos animais)</text>
    <text x="440" y="408">5 arquivos .jpg (fotos e anúncios)</text>

    <text x="440" y="510">estilos, com o layout em CSS Grid</text>
  </g>

  <!-- Legenda -->
  <circle cx="60" cy="550" r="6" fill="#8844EE"/>
  <text x="74" y="555" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#555555">pasta</text>
  <text x="150" y="555" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#555555">Arquivos com descrição ao lado</text>
</svg>
